[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-operations-control-plane"
version = "0.1.0"
description = "Reference architecture for operating AI as a governed enterprise capability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Enterprise AI Operations" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "streamlit>=1.39.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "bandit>=1.7.10",
  "pip-audit>=2.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
exclude = ["dashboard", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["yaml.*", "streamlit.*", "plotly.*", "pandas.*"]
ignore_missing_imports = true
